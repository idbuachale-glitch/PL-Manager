name: Publish app

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Data refreshes are pushed by the workflow's own token, which doesn't trigger a push event,
  # so republish whenever the data update finishes.
  workflow_run:
    workflows: ['Update player data']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect the files the app needs
        run: |
          mkdir -p _site/data
          cp -r index.html ui engine _site/
          cp data/players.json data/clubs.json data/fixtures.json data/teams.json data/meta.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
